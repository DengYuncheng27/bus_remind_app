name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Serialize releases so an older build cannot race the latest release.
concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.9'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check version and release safeguards
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          JPUSH_APP_KEY: ${{ vars.JPUSH_APP_KEY }}
        run: |
          test -n "$JPUSH_APP_KEY" || { echo 'Configure JPUSH_APP_KEY before publishing.' >&2; exit 1; }
          python3 tool/android_release.py version --tag "$RELEASE_TAG"
          python3 -m unittest discover -s tool -p test_android_release.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$ANDROID_BUILD_TOOLS" "platforms;android-36"'
      - name: Check application
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          node --test tool/*.test.mjs
      - name: Restore existing production signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          if any(not os.environ.get(name) for name in names):
              raise SystemExit('Configure the four ANDROID signing secrets using the existing release key.')
          os.umask(0o077)
          keystore = Path(os.environ['RUNNER_TEMP']) / 'android-release.jks'
          keystore.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          def prop(value):
              encoded = value.encode('utf-16-be')
              return ''.join('\\u' + encoded[i:i+2].hex() for i in range(0, len(encoded), 2))
          values = dict(storeFile=str(keystore), storePassword=os.environ['STORE_PASSWORD'],
                        keyAlias=os.environ['KEY_ALIAS'], keyPassword=os.environ['KEY_PASSWORD'])
          Path('android/key.properties').write_text(''.join(k + '=' + prop(v) + '\n' for k, v in values.items()))
          PY
      - name: Build and verify signed APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          JPUSH_APP_KEY: ${{ vars.JPUSH_APP_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=DEMO=false \
            --dart-define=API_BASE_URL=https://bus.su7.space \
            --dart-define=JPUSH_APP_KEY="$JPUSH_APP_KEY" \
            --dart-define=JPUSH_PRODUCTION=true
          python3 tool/android_release.py package --tag "$RELEASE_TAG" \
            --build-tools "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/android-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: build/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh run download "$RUN_ID" --name android-release --dir build/release
          cd build/release
          sha256sum --check SHA256SUMS
          cd ../..
          # A missing or unreadable previous manifest must fail, not bypass version checks.
          gh release list --limit 100 --json tagName,isDraft,isPrerelease > build/releases.json
          stable_count=$(python3 -c 'import json; print(sum(not r["isDraft"] and not r["isPrerelease"] for r in json.load(open("build/releases.json"))))')
          if [ "$stable_count" -gt 0 ]; then
            previous=$(gh release view --json tagName --jq .tagName)
            gh release download "$previous" --pattern android-release.json --dir build/previous
            python3 tool/android_release.py check-upgrade --tag "$RELEASE_TAG" --previous build/previous/android-release.json
          fi
          existing=$(python3 -c 'import json,os; print(next(("draft" if r["isDraft"] else "published" for r in json.load(open("build/releases.json")) if r["tagName"] == os.environ["RELEASE_TAG"]), "absent"))')
          if [ "$existing" = published ]; then
            echo 'Refusing to replace an already published release.' >&2
            exit 1
          fi
          if [ "$existing" = absent ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "下班王 $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" build/release/xiabanwang-android-arm64.apk \
            build/release/android-release.json build/release/SHA256SUMS --clobber
          # Only expose the release after every asset has uploaded successfully.
          gh release edit "$RELEASE_TAG" --draft=false --latest
